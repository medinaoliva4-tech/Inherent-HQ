<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0d0d0e">
<script src="/js/tema-boot.js"></script>
<!-- Desde la pantalla de inicio se abre a pantalla completa, como app. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Inherent">
<link rel="apple-touch-icon" href="/brand/icon-180.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="robots" content="noindex,nofollow">
<title>Inherent OS</title>
<link rel="icon" type="image/png" sizes="192x192" href="/brand/icon-192.png">
<link rel="icon" href="/brand/emblem-dark.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..700&family=Newsreader:opsz,wght@6..72,400..700&display=swap">
<link rel="stylesheet" href="/primitives.css">
<link rel="stylesheet" href="/app.css">
<link rel="stylesheet" href="/tablas.css">
</head>
<body>
<!-- La pantalla de arranque: se pinta con el HTML, antes de que baje un solo script. app.js le cambia la etapa y la desvanece
     cuando el cascarón (o el login) ya está debajo. Estilos en app.css › .boot. -->
<div id="root"><div class="boot" id="boot" role="status" aria-live="polite">
  <div class="boot-in">
    <span class="boot-emb"><img class="emb-dia" src="/brand/emblem-dark.svg" alt="Inherent" width="36" height="46"><img class="emb-noche" src="/brand/emblem.svg" alt="" width="36" height="46"></span>
    <span class="boot-bar" aria-hidden="true"><i></i></span>
    <p class="boot-t" id="boot-t">Conectando…</p>
  </div>
</div></div>
<div class="veil" id="veil"></div>
<aside class="drawer" id="drawer"></aside>
<div id="toast" role="status"></div>
<script type="module" src="/js/app.js"></script>
</body>
</html>
