<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Retoque</title>
<style>
  :root {
    --fondo: #0b0b0c; --panel: rgba(255,255,255,.045); --borde: rgba(255,255,255,.09); --luz: rgba(255,255,255,.16);
    --hueso: #ece6da; --crema: #f3ead8; --tenue: rgba(236,230,218,.58); --apagado: rgba(236,230,218,.34);
    --radio: 16px;
    font-family: ui-sans-serif, -apple-system, "SF Pro Text", "Inter", system-ui, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--fondo); color: var(--hueso); }
  body { background: radial-gradient(1200px 600px at 50% -10%, rgba(243,234,216,.07), transparent 60%), var(--fondo); }
  button, input, select { font: inherit; color: inherit; }
  .vidrio { background: var(--panel); border: 1px solid var(--borde); border-radius: var(--radio); box-shadow: inset 0 1px 0 var(--luz); backdrop-filter: blur(18px); }

  header { position: sticky; top: 0; z-index: 4; display: flex; align-items: center; gap: 10px; padding: 14px 22px;
    background: linear-gradient(var(--fondo) 70%, transparent); }
  header h1 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: -.01em; white-space: nowrap; }
  .meta { font-size: 12px; color: var(--tenue); white-space: nowrap; }
  .esp { flex: 1; }
  .chip { font-size: 11px; padding: 3px 9px; border-radius: 99px; border: 1px solid var(--borde); color: var(--tenue); }
  .vistas { display: flex; padding: 3px; gap: 2px; border-radius: 11px; }
  .vistas button { border: 0; background: transparent; padding: 6px 12px; border-radius: 8px; font-size: 13px; color: var(--tenue); cursor: pointer; }
  .vistas button.on { background: rgba(255,255,255,.1); color: var(--hueso); box-shadow: inset 0 1px 0 var(--luz); }
  .btn { border: 1px solid var(--borde); background: rgba(255,255,255,.06); border-radius: 10px; padding: 8px 14px; cursor: pointer; font-size: 13px;
    transition: background .15s, transform .1s; box-shadow: inset 0 1px 0 rgba(255,255,255,.08); white-space: nowrap; }
  .btn:hover { background: rgba(255,255,255,.1); }
  .btn:active { transform: scale(.97); }
  .btn.primario { background: var(--crema); color: #141210; border-color: transparent; font-weight: 600; }
  .btn.primario:hover { background: #fff6e4; }
  .btn:disabled { opacity: .4; cursor: default; }
  .btn.chico { padding: 4px 9px; font-size: 12px; border-radius: 8px; }
  .btn.icono { padding: 4px 7px; font-size: 12px; border-radius: 7px; min-width: 26px; }

  /* ── una escena dibujada (tarjeta o grande): video + capas, con zoom/color/animaciones iguales al render ── */
  .vista { position: relative; overflow: hidden; background: #000; container-type: size; touch-action: none; }
  .vista video.clip, .vista canvas.persona { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; will-change: transform; }
  .vista .capa { position: absolute; transform: translate(-50%, -50%); }
  .vista .capa.texto { white-space: pre; font-weight: 700; line-height: 1.12; text-align: center; padding: 1px 4px; border-radius: 4px;
    font-family: "DejaVu Sans", "Inter", Arial, sans-serif; -webkit-text-stroke: .045em #111; paint-order: stroke fill; }
  .vista .capa.imagen img, .vista .capa.imagen video { display: block; width: 100%; height: auto; }
  .vista.interactiva .capa { cursor: grab; outline: 1px dashed transparent; }
  .vista.interactiva .capa:hover { outline-color: rgba(243,234,216,.45); }
  .vista.interactiva .capa.sel { outline: 1.5px solid var(--crema); }
  .vista .tirador { position: absolute; right: -7px; bottom: -7px; width: 14px; height: 14px; border-radius: 50%; background: var(--crema);
    border: 2px solid #111; cursor: nwse-resize; display: none; }
  .vista .capa.sel .tirador { display: block; }
  .vista .capa[contenteditable="true"] { cursor: text; outline: 1.5px solid #fff; background: rgba(0,0,0,.3); }
  .vista .guia { position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: rgba(243,234,216,.55); display: none; pointer-events: none; }

  /* ── tablero ── */
  #tablero { padding: 4px 22px 40px; }
  .barra { display: flex; gap: 12px; align-items: center; padding: 10px 14px; margin-bottom: 18px; font-size: 13px; color: var(--tenue); flex-wrap: wrap; }
  .barra select { background: rgba(0,0,0,.3); border: 1px solid var(--borde); border-radius: 8px; padding: 6px 8px; font-size: 13px; }
  .barra input[type=range] { width: 120px; }
  .rejilla { display: grid; grid-template-columns: repeat(auto-fill, minmax(232px, 1fr)); gap: 18px; }
  .tarjeta { padding: 10px; display: flex; flex-direction: column; gap: 10px; transition: transform .18s, opacity .15s, border-color .15s; }
  .tarjeta:hover { border-color: var(--luz); }
  .tarjeta.arrastrando { opacity: .35; }
  .tarjeta.destino { border-color: var(--crema); }
  .tarjeta .cab { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--tenue); cursor: grab; }
  .tarjeta .cab b { color: var(--hueso); font-size: 13px; }
  .tarjeta .cab .esp { flex: 1; }
  .tarjeta .vista { border-radius: 12px; width: 100%; box-shadow: 0 0 0 1px var(--borde); cursor: pointer; }
  .tarjeta .nota { font-size: 11.5px; color: var(--apagado); line-height: 1.4; }
  .receta { display: flex; flex-direction: column; gap: 5px; }
  .ingrediente { display: flex; align-items: center; gap: 8px; font-size: 12.5px; padding: 6px 8px; border-radius: 9px; background: rgba(255,255,255,.035);
    border: 1px solid transparent; cursor: pointer; }
  .ingrediente:hover { border-color: var(--borde); }
  .ingrediente.abierto { border-color: var(--luz); background: rgba(255,255,255,.06); }
  .ingrediente .ico { width: 18px; text-align: center; opacity: .8; }
  .ingrediente .txt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ingrediente .x { opacity: 0; border: 0; background: none; cursor: pointer; color: var(--tenue); padding: 0 2px; }
  .ingrediente:hover .x { opacity: 1; }
  .ingrediente.aviso-falta .txt { color: #e9c79a; }
  .ajuste { padding: 8px 10px 4px; margin: -2px 0 2px; border-left: 2px solid var(--borde); display: flex; flex-direction: column; gap: 6px; }
  .opciones { display: flex; gap: 5px; flex-wrap: wrap; }
  .opciones button { border: 1px solid var(--borde); background: transparent; border-radius: 99px; padding: 3px 10px; font-size: 12px; cursor: pointer; color: var(--tenue); }
  .opciones button.on { background: var(--crema); color: #141210; border-color: transparent; }
  .agregar { position: relative; }
  .agregar select { width: 100%; background: transparent; border: 1px dashed var(--borde); border-radius: 9px; padding: 6px 8px; font-size: 12px; color: var(--tenue); cursor: pointer; }
  .fila { display: grid; grid-template-columns: 62px 1fr 40px; gap: 8px; align-items: center; font-size: 12px; color: var(--tenue); }
  .fila output { text-align: right; font-variant-numeric: tabular-nums; color: var(--hueso); }
  input[type=range] { width: 100%; accent-color: var(--crema); }

  /* ── escena (edición fina) ── */
  #escena { display: grid; grid-template-columns: 1fr 330px; gap: 18px; padding: 0 22px 24px; height: calc(100vh - 70px); }
  #escena .escenario { display: grid; grid-template-rows: 1fr auto; gap: 12px; min-height: 0; place-items: center; }
  #escena .grande { height: min(100%, 76vh); max-width: 100%; border-radius: 22px; box-shadow: 0 30px 80px rgba(0,0,0,.6), 0 0 0 1px var(--borde); }
  .controles { display: flex; gap: 8px; align-items: center; padding: 6px 10px; }
  .tiempo { font-variant-numeric: tabular-nums; font-size: 12px; color: var(--tenue); min-width: 92px; text-align: center; }
  aside { overflow: auto; display: flex; flex-direction: column; gap: 12px; }
  aside section { padding: 14px; display: flex; flex-direction: column; gap: 8px; }
  aside h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--apagado); margin: 0 0 2px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
  aside h2 .esp { flex: 1; }
  .capas { display: flex; flex-direction: column; gap: 4px; }
  .capa-fila { display: flex; align-items: center; gap: 6px; padding: 6px 8px; border-radius: 9px; font-size: 13px; cursor: pointer; border: 1px solid transparent; }
  .capa-fila:hover { background: rgba(255,255,255,.04); }
  .capa-fila.sel { border-color: var(--luz); background: rgba(255,255,255,.07); }
  .capa-fila .nom { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .capa-fila.oculta .nom { opacity: .4; text-decoration: line-through; }
  .capa-fila.base { cursor: default; color: var(--apagado); }
  .campo { width: 100%; background: rgba(0,0,0,.3); border: 1px solid var(--borde); border-radius: 8px; padding: 7px 9px; font-size: 13px; }
  textarea.campo { resize: vertical; min-height: 54px; font-family: inherit; }
  .colores { display: flex; gap: 6px; }
  .colores button { width: 22px; height: 22px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; }
  .colores button.on { border-color: #fff; }
  .aviso { position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%); padding: 10px 16px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 9; }
  .aviso.ver { opacity: 1; }
  .vacio { color: var(--apagado); font-size: 13px; padding: 60px; text-align: center; }
  [hidden] { display: none !important; }
  @media (max-width: 900px) { #escena { grid-template-columns: 1fr; height: auto; } #escena .grande { height: 64vh; } header { flex-wrap: wrap; } }
</style>
</head>
<body>
<header>
  <h1 id="titulo">Retoque</h1>
  <span class="chip" id="formato">9:16</span>
  <span class="meta" id="meta"></span>
  <span class="esp"></span>
  <div class="vistas vidrio"><button id="verTablero" class="on">Tablero</button><button id="verEscena">Escena</button></div>
  <button class="btn" id="deshacer" title="Deshacer (⌘Z)">Deshacer</button>
  <button class="btn" id="guardar">Guardar</button>
  <button class="btn primario" id="render">Exportar video</button>
</header>

<div id="tablero">
  <div class="barra vidrio" id="barra"></div>
  <div class="rejilla" id="rejilla"></div>
</div>

<div id="escena" hidden>
  <div class="escenario">
    <div class="vista interactiva grande" id="grande"></div>
    <div class="controles vidrio">
      <button class="btn chico" id="anterior">‹</button>
      <button class="btn chico" id="play">▶︎ Reproducir</button>
      <span class="tiempo" id="tiempo">0:00 / 0:00</span>
      <button class="btn chico" id="siguiente">›</button>
    </div>
  </div>
  <aside id="panel"></aside>
</div>
<div class="aviso vidrio" id="aviso"></div>

<script type="module">
// ─────────────────────────────────────────────────────────────────────────────────────────────
// Retoque: el editor del rol de editor. El agente arma el corte (JSON de escenas con su receta de estilos);
// aquí el humano lo revisa en el tablero y hace correcciones chicas. La vista previa imita el render de ffmpeg:
// mismo recorte (cover), mismo zoom (origen = punto de enfoque), mismas capas en el mismo orden.
// ─────────────────────────────────────────────────────────────────────────────────────────────
const q = new URLSearchParams(location.search);
const TOKEN = q.get('t');
const API = q.get('api') ?? '';
const RAZON = { '9:16': 9 / 16, '1:1': 1, '16:9': 16 / 9 };
const COLORES = { calido: 'Cálido', frio: 'Frío', bn: 'Blanco y negro', contraste: 'Contraste' };
const FILTRO_CSS = { calido: 'sepia(.14) saturate(1.1) hue-rotate(-6deg)', frio: 'saturate(.92) hue-rotate(10deg) brightness(1.02)', bn: 'grayscale(1) contrast(1.1)', contraste: 'contrast(1.15) saturate(1.12)' };
const PALETA = ['#f3ead8', '#ffffff', '#111111', '#f2c14e', '#e8735a', '#7cc5b5'];
const ESTILOS = [['zoom', 'Zoom'], ['color', 'Color'], ['transicion', 'Transición'], ['animacion-texto', 'Animación de texto'], ['detras-de-persona', 'Algo detrás de la persona']];
const $ = (id) => document.getElementById(id);
const h = (tag, props = {}, ...hijos) => { const e = Object.assign(document.createElement(tag), props); e.append(...hijos.flat().filter((x) => x != null && x !== false)); return e; };
const fmt = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
const medio = (ruta) => `${API}/medios?ruta=${encodeURIComponent(ruta)}${TOKEN ? `&t=${TOKEN}` : ''}`;
const nombre = (r) => r.split('/').pop();
async function pedir(metodo, ruta, cuerpo) {
  const r = await fetch(API + ruta, { method: metodo, headers: { 'content-type': 'application/json', ...(TOKEN ? { authorization: `Bearer ${TOKEN}` } : {}) }, body: cuerpo && JSON.stringify(cuerpo) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(j.error ?? `HTTP ${r.status}`), { estado: r.status });
  return j;
}
function aviso(t, ms = 2200) { const a = $('aviso'); a.textContent = t; a.classList.add('ver'); clearTimeout(aviso.t); aviso.t = setTimeout(() => a.classList.remove('ver'), ms); }

// ── estado ──
let corte = null, sel = 0, capaSel = null, abierto = null, sucio = false, modo = 'tablero';
let medios = { musica: [], imagenes: [], fuentes: [] };
const historia = [];
const marcar = () => { historia.push(JSON.stringify(corte)); if (historia.length > 100) historia.shift(); sucio = true; $('guardar').textContent = 'Guardar •'; };
const dur = (e) => e.fin - e.inicio;
const total = () => corte.escenas.reduce((s, e) => s + dur(e), 0);
const inicioDe = (i) => corte.escenas.slice(0, i).reduce((s, e) => s + dur(e), 0);
const est = (e, t) => e.estilos.find((s) => s.tipo === t);
let nId = 0; const nuevoId = (p) => `${p}${Date.now().toString(36)}${nId++}`;

// ── vista de una escena (la usan las tarjetas y la escena grande) ──
const vistas = new Set();
function crearVista(caja, { interactiva = false, enBucle = true, conSonido = false } = {}) {
  const video = h('video', { className: 'clip', muted: !conSonido, playsInline: true, preload: 'auto' });
  const capasDiv = h('div');
  const guia = h('div', { className: 'guia' });
  caja.append(video, capasDiv, guia);
  const v = { caja, video, escena: null, mascara: null, canvas: null, enBucle, interactiva, nodos: new Map(), reproduciendo: false };

  v.pintar = (escena) => {
    v.escena = escena;
    const src = medio(escena.clip);
    if (video.dataset.src !== src) { video.dataset.src = src; video.src = src; video.addEventListener('loadedmetadata', () => { video.currentTime = escena.inicio; if (enBucle) video.play().catch(() => {}); }, { once: true }); }
    else if (video.currentTime < escena.inicio || video.currentTime > escena.fin) video.currentTime = escena.inicio;
    // «detrás de la persona»: la persona recortada (clip × máscara) se dibuja en un canvas encima de la capa elegida
    const d = est(escena, 'detras-de-persona');
    if (d?.mascara) {
      if (!v.mascara) { v.mascara = h('video', { muted: true, playsInline: true, preload: 'auto' }); v.canvas = h('canvas', { className: 'persona' }); }
      const ms = medio(d.mascara);
      if (v.mascara.dataset.src !== ms) { v.mascara.dataset.src = ms; v.mascara.src = ms; }
    } else if (v.canvas) { v.canvas.remove(); v.canvas = null; v.mascara = null; }
    capasDiv.replaceChildren(); v.nodos.clear();
    escena.capas.forEach((c) => {
      if (!c.visible) return;
      const n = c.tipo === 'texto' ? h('div', { className: 'capa texto', textContent: c.texto })
        : h('div', { className: 'capa imagen' }, /\.(mov|webm|mp4)$/i.test(c.ruta) ? h('video', { src: medio(c.ruta), muted: true, loop: true, autoplay: true, playsInline: true }) : h('img', { src: medio(c.ruta), draggable: false }));
      if (interactiva) { n.classList.toggle('sel', capaSel === c.id); n.append(h('span', { className: 'tirador' })); manipular(v, n, c); }
      capasDiv.append(n); v.nodos.set(c.id, n);
      if (d?.mascara && d.capa === c.id) capasDiv.append(v.canvas);
    });
    v.colocar();
  };

  v.colocar = () => {
    const e = v.escena; if (!e) return;
    for (const c of e.capas) {
      const n = v.nodos.get(c.id); if (!n) continue;
      n.style.left = `${c.x * 100}%`; n.style.top = `${c.y * 100}%`;
      if (c.tipo === 'texto') { n.style.fontSize = `${c.tam * 100}cqh`; n.style.color = c.color; n.style.fontFamily = c.fuente ? `"${c.fuente}", "DejaVu Sans", Arial, sans-serif` : ''; }
      else n.style.width = `${c.escala * 100}%`;
    }
  };

  // cada cuadro: bucle del tramo, zoom, color, fundido, animación de texto y persona recortada
  v.cuadro = () => {
    const e = v.escena; if (!e || !video.readyState) return;
    if (video.currentTime >= e.fin - 0.02) { if (v.enBucle) video.currentTime = e.inicio; else if (v.alTerminar) v.alTerminar(); }
    const t = Math.max(0, video.currentTime - e.inicio), p = Math.min(1, t / dur(e));
    const z = est(e, 'zoom');
    const tr = z ? `scale(${z.desde + (z.hasta - z.desde) * p})` : 'none';
    const origen = z ? `${z.x * 100}% ${z.y * 100}%` : '50% 50%';
    const filtro = est(e, 'color') ? FILTRO_CSS[est(e, 'color').preset] : 'none';
    for (const el of [video, v.canvas].filter(Boolean)) { el.style.transform = tr; el.style.transformOrigin = origen; el.style.filter = filtro; }
    const f = est(e, 'transicion');
    v.caja.style.opacity = f?.entrada === 'fundido' ? Math.min(1, 0.15 + t / f.duracion) : 1;
    for (const a of e.estilos.filter((s) => s.tipo === 'animacion-texto')) {
      const n = v.nodos.get(a.capa); if (!n) continue;
      const k = Math.min(1, t / 0.5);
      n.style.opacity = k;
      n.style.transform = `translate(-50%, calc(-50% + ${a.animacion === 'subir' ? (1 - k) * 4 : 0}cqh))`;
    }
    if (v.canvas && v.mascara?.readyState >= 2) dibujarPersona(v);
  };
  vistas.add(v);
  return v;
}

// persona = clip con la máscara como alfa (luminancia → alfa), a resolución reducida para que sea liviano
function dibujarPersona(v) {
  const { video, mascara, canvas, caja } = v;
  if (Math.abs(mascara.currentTime - video.currentTime) > 0.08) mascara.currentTime = video.currentTime;
  if (!caja.clientWidth || !caja.clientHeight || !mascara.videoWidth || !video.videoWidth) return; // oculta o cargando
  const W = Math.min(360, caja.clientWidth), H = Math.round(W * caja.clientHeight / caja.clientWidth);
  if (canvas.width !== W || canvas.height !== H) { canvas.width = W; canvas.height = H; }
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  const cubrir = (fuente) => { const r = Math.max(W / fuente.videoWidth, H / fuente.videoHeight); const w = fuente.videoWidth * r, hh = fuente.videoHeight * r; ctx.drawImage(fuente, (W - w) / 2, (H - hh) / 2, w, hh); };
  cubrir(mascara); const m = ctx.getImageData(0, 0, W, H);
  cubrir(video); const c = ctx.getImageData(0, 0, W, H);
  for (let i = 0; i < c.data.length; i += 4) c.data[i + 3] = m.data[i];
  ctx.putImageData(c, 0, 0);
}
(function bucle() {
  requestAnimationFrame(bucle); // primero: un error en una vista no apaga las demás
  for (const v of vistas) {
    if (!v.caja.isConnected && !v.persistente) { vistas.delete(v); continue; }
    if (!v.caja.offsetParent) continue; // oculta (la otra pestaña): no gasta
    try { v.cuadro(); } catch (e) { console.error(e); }
  }
})();

// arrastrar para mover, tirador para agrandar/achicar, doble clic para escribir
function manipular(v, n, c) {
  n.onpointerdown = (ev) => {
    if (n.isContentEditable) return;
    ev.preventDefault(); ev.stopPropagation();
    capaSel = c.id; for (const x of v.nodos.values()) x.classList.toggle('sel', x === n);
    const r = v.caja.getBoundingClientRect();
    const tamano = ev.target.classList.contains('tirador');
    const ini = { x: ev.clientX, y: ev.clientY, tam: c.tam, escala: c.escala };
    n.setPointerCapture(ev.pointerId); let movido = false;
    n.onpointermove = (m) => {
      if (!movido) { marcar(); movido = true; }
      if (tamano) {
        const k = 1 + ((m.clientX - ini.x) + (m.clientY - ini.y)) / Math.max(80, n.offsetWidth);
        if (c.tipo === 'texto') c.tam = Math.min(0.25, Math.max(0.015, ini.tam * k)); else c.escala = Math.min(3, Math.max(0.05, ini.escala * k));
      } else {
        let x = (m.clientX - r.left) / r.width; const y = (m.clientY - r.top) / r.height;
        const centrado = Math.abs(x - 0.5) < 0.015; if (centrado) x = 0.5; // imán al centro
        v.caja.querySelector('.guia').style.display = centrado ? 'block' : 'none';
        c.x = Math.min(1, Math.max(0, x)); c.y = Math.min(1, Math.max(0, y));
      }
      v.colocar();
    };
    n.onpointerup = () => { n.onpointermove = null; v.caja.querySelector('.guia').style.display = 'none'; if (movido) pintarPanel(); else pintarPanel(); };
  };
  if (c.tipo === 'texto') n.ondblclick = () => {
    n.contentEditable = 'true'; n.focus(); document.getSelection().selectAllChildren(n);
    n.onblur = () => { const t = n.innerText.trim(); if (t && t !== c.texto) { marcar(); c.texto = t; } n.contentEditable = 'false'; pintarTodo(); };

};
window.addEventListener('beforeunload', (e) => { if (sucio) e.preventDefault(); });

async function iniciar() {
  const id = q.get('corte');
  if (!id) { $('rejilla').append(h('div', { className: 'vacio', textContent: 'Abre un corte: /editor/?corte=<id>' })); return; }
  try {
    const lista = (r) => pedir('GET', r).catch(() => ({}));
    const [c, m, i, f] = await Promise.all([pedir('GET', `/cortes/${id}`), lista('/medios/musica'), lista('/medios/imagenes'), lista('/medios/fuentes')]);
    corte = c.corte; medios = { musica: m.archivos ?? [], imagenes: i.archivos ?? [], fuentes: f.fuentes ?? [] };
    // las tipografías propias se cargan con su nombre real: el mismo que usa el render (libass)
    for (const t of medios.fuentes) new FontFace(t.nombre, `url(${medio(t.ruta)})`).load().then((ff) => document.fonts.add(ff)).catch(() => {});
    if (q.get('vista') === 'escena') { sel = Number(q.get('escena') ?? 0); cambiarModo('escena'); } else pintarTodo();
  } catch (e) { $('rejilla').append(h('div', { className: 'vacio', textContent: `No se pudo abrir el corte: ${e.message}` })); }
}
iniciar();
window.retoque = { get corte() { return corte; }, guardar, cambiarModo };
</script>
