<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><link rel="icon" href="data:,">
<title>Reels __CLIENTE__ · Aprobación</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap">
<style>
/* Muro de aprobación: rejilla de piezas 9:16, cada una con su caption y su dictamen */
@font-face{font-family:"Display";src:url(data:font/ttf;base64,__DISPLAY__) format("truetype");font-display:block}
@font-face{font-family:"Sans";src:url(data:font/ttf;base64,__SANS__) format("truetype");font-weight:300 900;font-display:swap}
:root{--bg:#F6EFE0;--surface:#FFFDF8;--ink:#191919;--muted:#6B6257;--line:#E2D5BD;--accent:#842A15;--ok:#4F6B2E;--warn:#A35A16;--field:#FFFFFF;
  --display:"Display",Impact,"Arial Narrow",sans-serif;--sans:"Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--serif:"Instrument Serif",Georgia,serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#141312;--surface:#1D1B19;--ink:#F3ECDD;--muted:#A89C8A;--line:#36302A;--accent:#D9826A;--ok:#9DBB6E;--warn:#E0A060;--field:#24211E;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding:32px 20px 80px}
.kick{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
h1{font-family:var(--display);font-weight:400;font-size:clamp(48px,9vw,92px);line-height:.9;text-transform:uppercase;margin:8px 0 0;text-wrap:balance}
.lede{max-width:62ch;color:var(--muted);margin:14px 0 0}.lede em{font-family:var(--serif);font-size:1.15em;color:var(--ink)}
.tally{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0 0}
.chip{display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}
.banner{margin-top:16px;padding:10px 14px;border-radius:10px;border:1px solid var(--accent);background:var(--surface);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:22px;margin-top:28px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.card[data-state="aprobado"]{border-color:var(--ok)}.card[data-state="cambios"]{border-color:var(--warn)}
.media{position:relative;background:#000;aspect-ratio:9/16;max-width:100%}.media video{width:100%;height:100%;object-fit:cover;display:block}
.badge{position:absolute;top:12px;left:12px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:5px 9px;border-radius:999px;background:rgba(25,25,25,.72);color:#FDF7E8}
.badge.ok{background:var(--ok);color:#fff}.badge.warn{background:var(--warn);color:#fff}
.body{padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.head h2{font-family:var(--display);font-weight:400;font-size:30px;line-height:.95;text-transform:uppercase;margin:0}
.meta{font-size:12px;color:var(--muted);white-space:nowrap}.label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.caption{white-space:pre-wrap;font-size:14px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;max-height:230px;overflow:auto}.caption .foot{color:var(--muted)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
button{font:600 13px var(--sans);border-radius:999px;border:1px solid var(--line);background:var(--field);color:var(--ink);padding:8px 14px;cursor:pointer}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button[aria-pressed="true"].approve{background:var(--ok);border-color:var(--ok);color:#fff}button[aria-pressed="true"].changes{background:var(--warn);border-color:var(--warn);color:#fff}
.stars button{border:none;background:none;padding:2px 3px;font-size:22px;line-height:1;color:var(--line)}.stars button.on{color:var(--accent)}
textarea{font:14px var(--sans);color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%;min-height:76px;resize:vertical}
.state{font-size:12px;color:var(--muted)}.state.saved{color:var(--ok)}.state.err{color:var(--accent)}
footer{margin-top:40px;border-top:1px solid var(--line);padding-top:20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;font-size:14px}
footer b{display:block;font-family:var(--display);font-weight:400;font-size:22px;text-transform:uppercase}
</style></head><body>
<div class="wrap">
  <div class="kick">__CLIENTE__ · __CICLO__</div>
  <h1>Reels para aprobar</h1>
  <p class="lede">Mira cada video, califícalo con estrellas y elige <b>Aprobar</b> o <b>Pedir cambios</b>. Si pides cambios, escribe qué te gustaría distinto. La descripción es el texto que acompañará la publicación. <em>Todo se guarda solo.</em></p>
  <div class="tally" id="tally"></div>
  <div class="banner" id="banner" hidden></div>
  <main class="grid" id="grid"></main>
  <footer id="foot"></footer>
</div>
<script>
const DATA=__DATA__;const reviews={};
const el=(t,a,...k)=>{const e=document.createElement(t);for(const[n,v]of Object.entries(a||{})){if(n==="class")e.className=v;else if(n==="text")e.textContent=v;else e.setAttribute(n,v)}for(const c of k)if(c!=null)e.append(c);return e};
function tally(){const t=document.getElementById("tally");t.textContent="";let ok=0,ch=0;for(const v of DATA.videos){const s=reviews[v.id]?.estado;if(s==="aprobado")ok++;else if(s==="cambios")ch++}
  t.append(el("span",{class:"chip"},el("span",{class:"dot ok"}),document.createTextNode(`${ok} aprobados`)),el("span",{class:"chip"},el("span",{class:"dot warn"}),document.createTextNode(`${ch} con cambios`)),el("span",{class:"chip"},el("span",{class:"dot"}),document.createTextNode(`${DATA.videos.length-ok-ch} pendientes`)))}
const timers={};
async function save(v,state){const r=reviews[v.id]||{};state.textContent="Guardando…";state.className="state";
  try{const res=await fetch("/api/reviews",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({video:v.id,version:v.v,estado:r.estado||"pendiente",calificacion:r.calificacion||0,comentarios:r.comentarios||""})});
    if(!res.ok)throw 0;r.actualizado=(await res.json()).rec.actualizado;state.textContent="Guardado";state.className="state saved"}
  catch(e){state.textContent="No se guardó. Revisa tu conexión e intenta de nuevo.";state.className="state err"}}
function queue(v,state,ms){clearTimeout(timers[v.id]);state.textContent="Sin guardar";state.className="state";timers[v.id]=setTimeout(()=>save(v,state),ms)}
function card(v){const r=reviews[v.id]||(reviews[v.id]={});const c=el("article",{class:"card"});const badge=el("span",{class:"badge"});
  const paint=()=>{c.dataset.state=r.estado||"pendiente";badge.className="badge"+(r.estado==="aprobado"?" ok":r.estado==="cambios"?" warn":"");badge.textContent=r.estado==="aprobado"?"Aprobado":r.estado==="cambios"?"Con cambios":"Pendiente";tally()};
  const vid=el("video",{src:`videos/${v.id}.mp4?v=${v.v}`,poster:`videos/${v.id}.jpg?v=${v.v}`,controls:"",playsinline:"",preload:"none",muted:""});vid.muted=true;
  c.append(el("div",{class:"media"},vid,badge));
  const state=el("span",{class:"state",text:r.actualizado?"Guardado":""});
  const full=v.caption+"\n\n"+DATA.footer;const cap=el("div",{class:"caption"},document.createTextNode(v.caption+"\n\n"),el("span",{class:"foot",text:DATA.footer}));
  const copy=el("button",{type:"button",text:"Copiar descripción"});
  copy.addEventListener("click",async()=>{try{await navigator.clipboard.writeText(full);copy.textContent="Copiada"}catch(e){const s=getSelection(),rg=document.createRange();rg.selectNodeContents(cap);s.removeAllRanges();s.addRange(rg);copy.textContent="Seleccionada: usa Copiar"}setTimeout(()=>copy.textContent="Copiar descripción",2200)});
  const stars=el("div",{class:"stars row",role:"group","aria-label":"Calificación"});const draw=()=>[...stars.children].forEach((b,i)=>b.classList.toggle("on",i<(r.calificacion||0)));
  for(let i=1;i<=5;i++){const b=el("button",{type:"button","aria-label":`${i} de 5`,text:"★"});b.addEventListener("click",()=>{r.calificacion=i;draw();queue(v,state,300)});stars.append(b)}
  const ap=el("button",{type:"button",class:"approve","aria-pressed":String(r.estado==="aprobado"),text:"Aprobar"});const chg=el("button",{type:"button",class:"changes","aria-pressed":String(r.estado==="cambios"),text:"Pedir cambios"});
  const ta=el("textarea",{id:"c_"+v.id,placeholder:"¿Qué cambiarías? Escena, texto, duración, descripción…"});ta.value=r.comentarios||"";
  const set=s=>{r.estado=r.estado===s?"pendiente":s;ap.setAttribute("aria-pressed",String(r.estado==="aprobado"));chg.setAttribute("aria-pressed",String(r.estado==="cambios"));paint();if(r.estado==="cambios")ta.focus();queue(v,state,200)};
  ap.addEventListener("click",()=>set("aprobado"));chg.addEventListener("click",()=>set("cambios"));ta.addEventListener("input",()=>{r.comentarios=ta.value;queue(v,state,800)});draw();
  c.append(el("div",{class:"body"},el("div",{class:"head"},el("h2",{text:v.title}),el("span",{class:"meta",text:`${v.dur} · ${v.v}`})),el("div",{},el("div",{class:"label",text:"Descripción"}),cap),el("div",{class:"row"},copy),
    el("div",{class:"row"},el("span",{class:"label",text:"Calificación"}),stars),el("div",{class:"row"},ap,chg),el("label",{class:"label",for:"c_"+v.id,text:"Comentarios"}),ta,state));paint();return c}
function render(){const g=document.getElementById("grid");g.textContent="";DATA.videos.forEach(v=>g.append(card(v)));tally()}
const f=document.getElementById("foot");(DATA.datos||[]).forEach(([a,b])=>f.append(el("div",{},el("b",{text:a}),document.createTextNode(b))));
render();
(async()=>{try{const res=await fetch("/api/reviews",{cache:"no-store"});if(!res.ok)throw 0;for(const[k,x]of Object.entries(await res.json()))reviews[k]=Object.assign({},x);render()}
  catch(e){const b=document.getElementById("banner");b.hidden=false;b.textContent="No pude cargar las respuestas guardadas. Recarga la página."}})();
</script></body></html>
