<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Inherent</title>
<style>
  :root{color-scheme:light dark;--bg:#fafaf9;--ink:#1a1a1a;--mut:#6b6b6b}
  @media (prefers-color-scheme:dark){:root{--bg:#0d0d0e;--ink:#f2f2f0;--mut:#9a9a98}}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,system-ui,sans-serif}
  main{min-height:100%;display:grid;place-content:center;gap:12px;padding:32px;text-align:center}
  h1{margin:0;font-size:22px;font-weight:500}p{margin:0;color:var(--mut)}
  button{margin-top:8px;min-height:44px;padding:0 20px;border:0;border-radius:12px;background:var(--ink);color:var(--bg);font:inherit}
</style></head><body><main>
  <h1>No pude abrir Inherent OS</h1>
  <p>Revisa tu conexión. Esta pantalla solo se ve cuando no hay red.</p>
  <button type="button" onclick="location.reload()">Reintentar</button>
</main></body></html>
